# Cloud Run environment for the backend.
# Copy to cloudrun/env.yaml (git-ignored), fill in, and pass with
#   gcloud run deploy ... --env-vars-file cloudrun/env.yaml
# Every value must be a quoted string.

# Supabase: Dashboard → Project Settings → API
SUPABASE_URL: "https://csgisywxqylbrayhmmqz.supabase.co"
SUPABASE_KEY: "anon-key"
SUPABASE_SERVICE_ROLE_KEY: "service-role-key"

# Long random strings: python -c "import secrets; print(secrets.token_urlsafe(48))"
# A new JWT_SECRET just means everyone logs in again once.
JWT_SECRET: "change-me"
ADMIN_REGISTER_SECRET: "change-me"

FLASK_DEBUG: "0"
SCHOOL_NAME: "Lekki Peculiar School"
TZ: "Africa/Lagos"

# Only the real frontend may call the API from a browser
CORS_ORIGINS: "https://peculiar-register.vercel.app"

# Cloud Run throttles CPU after each reply; wait up to 5 s for notifications
BACKGROUND_WAIT_SECONDS: "5"

# Gmail: use an App Password, not the account password
SMTP_SERVER: "smtp.gmail.com"
SMTP_PORT: "587"
SMTP_EMAIL: "school@gmail.com"
SMTP_PASSWORD: "xxxx xxxx xxxx xxxx"

# D7 Networks WhatsApp: app.d7networks.com → API tokens
D7_API_TOKEN: ""
D7_WHATSAPP_FROM: "+2348000000000"

# Staff mobile sign-in (used once those sessions are merged)
STAFF_JWT_SECRET: "change-me-too"
WEBAUTHN_RP_ID: "peculiar-register.vercel.app"
WEBAUTHN_RP_NAME: "LPS Staff"
WEBAUTHN_ORIGIN: "https://peculiar-register.vercel.app"
CRON_SECRET: "change-me-three"
